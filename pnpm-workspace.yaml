packages:
  - frontend
  - backend
  - shared
# pnpm 11 doesn't run a dependency's install/postinstall scripts by default
# (supply-chain safety) unless it's explicitly trusted here. Without this,
# Prisma's client generation, sharp's native binary, and esbuild's platform
# binary would all silently fail to build - not an install error, just
# broken behavior discovered later.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

# Two copies of fastify means two FastifyInstance types, and the plugins
# augment only one of them, so app.register() stops type-checking. Pin one.
overrides:
  fastify: 5.12.0
  # Transitive under next, which has no release carrying the fixes yet. All
  # three are drop-in within their own major.
  postcss: '>=8.5.26'
  nanoid: '>=3.3.18 <4'
  sharp: '>=0.35.3'
  # Test tooling only, never shipped, but there is no reason to keep a known
  # path traversal in the dev server.
  vite: '>=6.4.3'
  esbuild: '>=0.24.3'
